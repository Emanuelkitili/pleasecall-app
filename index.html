<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PleaseCall - Pigia Mum na 2 bob</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.card{background:white;border-radius:20px;padding:20px;max-width:400px;margin:auto}
input{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc}
.btn{background:#1BA157;color:white;padding:18px;width:100%;border:none;border-radius:12px;font-size:20px;font-weight:bold}
.header{background:#8FCB9B;padding:15px;border-radius:15px;text-align:center;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div class="header">PleaseCall App<br>Pigia Mum na 2 bob tu! 🇰🇪</div>
<p>Send quick voice & call Mum for 2 bob via M-Pesa</p>
<label>Mum's kabambe number</label>
<input id="mum" placeholder="+254 7XX XXX XXX">
<label>Voice message</label>
<input id="msg" placeholder="Mum ni mimi, nipigie tafadhali">
<button class="btn" onclick="lipa()">LIPA 2 BOB<br><small>(1 kwako + 1 call)</small></button>
<p style="text-align:center;font-size:12px">🔒 Powered by Safaricom M-Pesa • Secure</p>
</div>
<script>
function lipa(){
  let mum=document.getElementById('mum').value;
  let msg=document.getElementById('msg').value;
  fetch('/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mum_number:mum,message:msg,amount:2})})
  .then(r=>r.json()).then(d=>alert(d.message));
}
</script>
</body>
</html>
