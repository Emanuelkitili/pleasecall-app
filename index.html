<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PleaseCall</title><style>
body{font-family:sans-serif;background:#e8f5e9;padding:15px}
.card{background:#fff;border-radius:20px;padding:20px;max-width:380px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input{width:92%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ccc}
.btn{background:#1BA157;color:#fff;padding:18px;width:100%;border:none;border-radius:12px;font-size:20px;font-weight:bold}
.head{background:#8FCB9B;padding:12px;border-radius:12px;text-align:center;color:#fff;font-weight:bold}
</style></head><body>
<div class="card">
<div class="head">PleaseCall App<br>Pigia Mum na 2 bob tu! 🇰🇪</div>
<p>Send quick voice & call Mum for just 2 bob via M-Pesa</p>
<label>Mum's kabambe number</label>
<input id="mum" placeholder="07XX XXX XXX">
<label>Voice message</label>
<input id="msg" placeholder="Mum ni mimi, nipigie">
<button class="btn" onclick="lipa()">LIPA 2 BOB<br><small>(1 kwako + 1 call)</small></button>
<p style="text-align:center;font-size:11px">🔒 Powered by M-Pesa • Secure</p>
</div>
<script>
function lipa(){
  let mum=document.getElementById('mum').value;
  let msg=document.getElementById('msg').value;
  if(!mum){alert('Weka namba ya Mum');return}
  alert('Asante! Tunampigia '+mum+' RING RING...');
  fetch('/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mum_number:mum,message:msg,amount:2})})
  .then(r=>r.json()).then(d=>alert(d.message));
}
</script>
</body></html>
